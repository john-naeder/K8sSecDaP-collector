include:
  # Namespace là 'root' vì GitLab self-hosted này chạy dưới tài khoản admin
  # mặc định, không phải tên người dùng GitHub. Sai namespace thì pipeline hỏng
  # ngay ở bước include, trước khi bất kỳ job nào chạy.
  - project: 'root/ci-templates'
    ref: main
    file: '/security.gitlab-ci.yml'

stages:
  - scan
  - report

variables:
  # eBPF (C) plus a Go userspace side. The collector runs privileged on every
  # node, so iac:trivy on the DaemonSet manifest is worth more than it looks.
  SECURITY_FAIL_ON: ''
